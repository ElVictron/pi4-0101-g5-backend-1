name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  testes:
    name: Lint e testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblioteca_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biblioteca_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/biblioteca_teste

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # o Sonar usa o histórico para atribuir o código novo

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Testes (contrato + unitários) com cobertura
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      # Só roda na versão principal do Python e quando o segredo SONAR_TOKEN existe
      # (PRs de forks não recebem segredos; sem token o passo é pulado).
      - name: Análise no SonarQube Cloud
        if: matrix.python == '3.12' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
